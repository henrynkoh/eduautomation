<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }
    @keyframes pulse {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }
    .floating {
      animation: float 6s ease-in-out infinite;
    }
    .floating-alt {
      animation: float 5s ease-in-out infinite;
      animation-delay: 0.5s;
    }
    .floating-slow {
      animation: float 8s ease-in-out infinite;
    }
    .pulse {
      animation: pulse 4s ease-in-out infinite;
    }
  </style>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#F8FAFC" rx="20" ry="20" />

  <!-- Container box -->
  <g class="floating-slow">
    <rect x="220" y="120" width="360" height="320" rx="20" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
    <rect x="240" y="140" width="320" height="40" rx="8" fill="#DBEAFE" />
    
    <!-- Docker logo styled container -->
    <g transform="translate(300, 220)">
      <rect width="200" height="150" rx="8" fill="#2563EB" class="pulse" />
      <g fill="white" transform="translate(50, 30)">
        <rect x="0" y="0" width="30" height="30" rx="4" />
        <rect x="40" y="0" width="30" height="30" rx="4" />
        <rect x="80" y="0" width="30" height="30" rx="4" />
        <rect x="0" y="40" width="30" height="30" rx="4" />
        <rect x="40" y="40" width="30" height="30" rx="4" />
        <rect x="80" y="40" width="30" height="30" rx="4" />
      </g>
    </g>
  </g>

  <!-- AI/ML nodes -->
  <g class="floating" transform="translate(600, 150)">
    <circle cx="0" cy="0" r="40" fill="#C7D2FE" stroke="#4F46E5" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#4F46E5" />
    <line x1="-20" y1="-10" x2="-10" y2="20" stroke="#4F46E5" stroke-width="2" />
    <line x1="-20" y1="-10" x2="20" y2="-15" stroke="#4F46E5" stroke-width="2" />
    <line x1="20" y1="-15" x2="15" y2="10" stroke="#4F46E5" stroke-width="2" />
    <line x1="15" y1="10" x2="-10" y2="20" stroke="#4F46E5" stroke-width="2" />
    <circle cx="-20" cy="-10" r="4" fill="#4F46E5" />
    <circle cx="-10" cy="20" r="4" fill="#4F46E5" />
    <circle cx="20" cy="-15" r="4" fill="#4F46E5" />
    <circle cx="15" cy="10" r="4" fill="#4F46E5" />
  </g>

  <!-- Workflow automation -->
  <g class="floating-alt" transform="translate(130, 250)">
    <rect x="0" y="0" width="120" height="160" rx="12" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2" />

    <!-- Workflow connections -->
    <line x1="30" y1="40" x2="90" y2="40" stroke="#8B5CF6" stroke-width="2" />
    <line x1="30" y1="80" x2="90" y2="80" stroke="#8B5CF6" stroke-width="2" />
    <line x1="30" y1="120" x2="90" y2="120" stroke="#8B5CF6" stroke-width="2" />
    
    <circle cx="30" cy="40" r="8" fill="#8B5CF6" />
    <circle cx="90" cy="40" r="8" fill="#8B5CF6" />
    <circle cx="30" cy="80" r="8" fill="#8B5CF6" />
    <circle cx="90" cy="80" r="8" fill="#8B5CF6" />
    <circle cx="30" cy="120" r="8" fill="#8B5CF6" />
    <circle cx="90" cy="120" r="8" fill="#8B5CF6" />

    <!-- Flow connections -->
    <line x1="90" y1="40" x2="30" y2="80" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4 2" />
    <line x1="90" y1="80" x2="30" y2="120" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4 2" />
  </g>

  <!-- Gear/Cog decoration -->
  <g class="floating" transform="translate(600, 380)">
    <path d="M0,25 L0,15 L-6,13 L-10,5 L-7,-2 L-15,-10 L-22,-7 L-30,-12 L-28,-18 L-38,-23 L-45,-18 L-50,-25 L-45,-32 L-38,-37 L-28,-42 L-22,-47 L-15,-50 L-7,-58 L-10,-65 L-6,-73 L0,-75 L6,-73 L10,-65 L7,-58 L15,-50 L22,-47 L30,-42 L37,-35 L45,-32 L50,-25 L45,-18 L37,-15 L30,-12 L22,-7 L15,-10 L7,-2 L10,5 L6,13 Z" fill="#FECACA" stroke="#EF4444" stroke-width="2" transform="scale(0.8)" />
    <circle cx="0" cy="0" r="15" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#EF4444" />
  </g>

  <!-- Books/Learning -->
  <g class="floating-slow" transform="translate(150, 110)">
    <rect x="0" y="0" width="80" height="100" rx="2" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" />
    <rect x="5" y="10" width="70" height="10" rx="1" fill="#FEF3C7" />
    <rect x="5" y="30" width="70" height="5" rx="1" fill="#FEF3C7" />
    <rect x="5" y="40" width="50" height="5" rx="1" fill="#FEF3C7" />
    <rect x="5" y="55" width="70" height="5" rx="1" fill="#FEF3C7" />
    <rect x="5" y="65" width="40" height="5" rx="1" fill="#FEF3C7" />
    <rect x="5" y="80" width="60" height="5" rx="1" fill="#FEF3C7" />
  </g>

  <!-- Code window -->
  <g class="floating-alt" transform="translate(455, 400)">
    <rect x="0" y="0" width="120" height="110" rx="6" fill="#F1F5F9" stroke="#64748B" stroke-width="2" />
    <rect x="0" y="0" width="120" height="25" rx="6" fill="#64748B" />
    <circle cx="15" cy="12.5" r="5" fill="#EF4444" />
    <circle cx="35" cy="12.5" r="5" fill="#F59E0B" />
    <circle cx="55" cy="12.5" r="5" fill="#10B981" />
    
    <!-- Code lines -->
    <rect x="10" y="35" width="80" height="4" rx="1" fill="#94A3B8" />
    <rect x="10" y="45" width="60" height="4" rx="1" fill="#94A3B8" />
    <rect x="20" y="55" width="90" height="4" rx="1" fill="#3B82F6" />
    <rect x="20" y="65" width="70" height="4" rx="1" fill="#3B82F6" />
    <rect x="10" y="75" width="50" height="4" rx="1" fill="#94A3B8" />
    <rect x="10" y="85" width="100" height="4" rx="1" fill="#94A3B8" />
  </g>
</svg> 